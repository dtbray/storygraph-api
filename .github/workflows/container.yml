name: Container

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build image
        run: docker build --label "org.opencontainers.image.revision=${{ github.sha }}" -t "ghcr.io/dtbray/storygraph-api:main" -t "ghcr.io/dtbray/storygraph-api:sha-${GITHUB_SHA}" .
      - name: Push image
        run: docker push --all-tags ghcr.io/dtbray/storygraph-api
